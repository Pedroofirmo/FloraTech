<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | FloraTech</title>
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/styles/entrar.css">
</head>
<body>

    <div class="container-login">
        
        <header class="login-header">
            <img src="../assets/img/logo.png" alt="Logo da Tend" class="logo"> 
            <h1>entrar</h1>
            <p class="subtitle">Entre na sua conta FloraTech</p>
        </header>

        <button class="btn-social-login">
            <img src="../assets/img/google-logo.png" alt="Ícone do Google"> 
            Entrar com google
        </button>
        
        <div class="divider">
            <span class="or-text">ou</span>
        </div>

        <form id="form-login" class="card-login"> 
            <input type="email" placeholder="Email" class="input-email" name="email" required>
            
            <div class="password-field">
                <input type="password" placeholder="Senha" class="input-password" name="senha" required>
                <span class="toggle-password"></span> 
            </div>
            
            <a href="esqueceu.html" class="forgot-password-link">Esqueceu a senha?</a>

            <button type="submit" class="button-login">Entrar</button>
        </form>

    </div>

    <script src="../scripts/entrar.js"></script>
</body>
</html>
