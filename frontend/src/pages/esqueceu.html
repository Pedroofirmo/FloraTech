<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | FloraTech</title>
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/styles/esqueceu.css">
</head>
<body>
    <div class="container-login">
        <header class="login-header">
            <img src="../assets/img/logo.png" alt="Logo da Tend" class="logo"> 
            <h1>Redefinir Senha</h1>
            <p class="subtitle">Redefina sua senha</p>
        </header>

        <form action="/login" method="POST" class="card-login"> 
            <input type="email" placeholder="Email" class="input-email" name="email" required>

            <a href="#" class="forgot-password-link">Não sei meu email</a>

            <button type="submit" class="button-login">Enviar</button>
        </form>

        <div class="links-signup">
            <p>Lembrou sua senha?</p>
            <a href="entrar.html" class="signup-link">Entrar</a>
        </div>

    </div>

    <script src="../scripts/esqueceu.js"></script>
</body>
</html>
